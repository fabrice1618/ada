# Tenant d'argos. Lancer avec ./start.sh : le reseau reverse-proxy-net et
# logs_rsyslog doivent deja tourner. Le proxy route tout le domaine vers le
# conteneur ada (port 8000), pages de cours /cours/ comprises : ada controle
# lui-meme session et creneau. La declaration du domaine (ada.mips.science,
# ada.localhost, body_size=20m) se fait dans argos, pas ici.

name: ada

services:
  ada:
    build: ./app
    image: ada
    container_name: ada
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-0}
      DOMAIN: ${DOMAIN:-ada.localhost}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-pdf,zip,tar.gz,py,java,c,cpp,txt}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-10}
    # Toutes les donnees : ada.db, classes/<id>/ (classe.db + fichiers), cours/,
    # sauvegardes/, exports/ — voir app/ada/db.py.
    volumes:
      - data:/data
    networks:
      - reverse-proxy-net
    expose:
      - "8000"
    labels:
      argos.monitor: "true"
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        tag: "ada"
        syslog-facility: "daemon"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/login/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  reverse-proxy-net:
    external: true

volumes:
  data:
