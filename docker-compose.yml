# Tenant d'argos. Lancer avec ./start.sh : le reseau reverse-proxy-net et
# logs_rsyslog doivent deja tourner. Le proxy route le conteneur ada-auth
# (port 8000) et /cours/ vers ada-cours (port 80). La declaration du domaine
# (ada.mips.science, ada.localhost, body_size=20m) et le routage de /cours/
# (applications/ada/sites-extra/) se font dans argos, pas ici.

name: ada

services:
  mysql:
    image: mysql:8.0
    container_name: ada-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      argos.monitor: "true"
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        tag: "ada-mysql"
        syslog-facility: "daemon"

  auth:
    build: ./auth
    container_name: ada-auth
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-0}
      DOMAIN: ${DOMAIN:-ada.localhost}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-pdf,zip,tar.gz,py,java,c,cpp,txt}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-10}
      UPLOAD_ROOT: /uploads
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    volumes:
      - uploads:/uploads
    networks:
      - backend
      - reverse-proxy-net
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8000"
    labels:
      argos.monitor: "true"
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        tag: "ada"
        syslog-facility: "daemon"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/login/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # Pages de cours (content/), servies sous /cours/. Argos ne les transmet
  # qu'apres un 200 de ada-auth (auth_request -> /auth/verify/).
  cours:
    build: ./nginx
    container_name: ada-cours
    volumes:
      - ./content:/usr/share/nginx/html:ro
    networks:
      - reverse-proxy-net
    expose:
      - "80"
    labels:
      argos.monitor: "true"
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        tag: "ada-cours"
        syslog-facility: "daemon"
    restart: unless-stopped

networks:
  backend:
  reverse-proxy-net:
    external: true

volumes:
  db_data:
  uploads:
